name: Deploy NokaTV to PlanetHoster
on:
  push:
    branches:
      - master

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Exécuter les tests Python
        run: python -m pytest -q

      - name: Exécuter les tests JavaScript
        run: |
          node scripts/test_pwa_install_manager.js
          node scripts/test_pwa_install_prompt.js

  deploy:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Deploy NokaTV
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PH_HOST }}
          username: ${{ secrets.PH_USER }}
          key: ${{ secrets.PH_SSH_KEY }}
          port: ${{ secrets.PH_PORT }}

          script: |
            set -e

            echo "======================================"
            echo "        DEPLOIEMENT NOKATV"
            echo "======================================"

            cd /home/wtzjscfs/nokatv

            echo "=== Mise à jour du code ==="

            git fetch origin
            git reset --hard origin/master

            echo "=== Activation de Python 3.10 ==="

            VENV="/home/wtzjscfs/virtualenv/nokatv/3.10"

            if [ ! -f "$VENV/bin/activate" ]; then
              echo "ERREUR: environnement Python introuvable:"
              echo "$VENV"
              exit 1
            fi

            source "$VENV/bin/activate"

            echo "Python utilisé:"
            which python
            python --version

            echo "Pip utilisé:"
            python -m pip --version

            echo "=== Installation des dépendances ==="

            python -m pip install --upgrade pip
            python -m pip install --upgrade -r requirements.txt

            echo "=== Vérification FastAPI ==="

            python -c "import fastapi; print('FastAPI:', fastapi.__version__)"

            echo "=== Vérification Uvicorn ==="

            python -c "import uvicorn; print('Uvicorn OK')"

            echo "=== Vérification de l'application ==="

            python -c "from main import app; print('Application FastAPI OK')"

            echo "=== Redémarrage Passenger ==="

            mkdir -p tmp
            touch tmp/restart.txt

            echo "======================================"
            echo "       DEPLOIEMENT TERMINE"
            echo "======================================"