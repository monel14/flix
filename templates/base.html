<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>{% block title %}Coflix — Streaming Films, Séries, K-Dramas & Animés VF/VOSTFR{% endblock %}</title>
    <meta name="description" content="{% block description %}Plateforme de streaming gratuit pour regarder des films, séries, K-Dramas et animés japonais en VF et VOSTFR HD.{% endblock %}">
    
    <!-- Google Font Plus Jakarta Sans & Font Awesome 6 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>

<!-- Header / Navigation Bar (Frosted Glass) -->
<header class="site-header" id="site-header">
    <div class="header-inner">
        <!-- Logo -->
        <a class="brand" href="/">
            <div class="brand-icon"><i class="fas fa-play"></i></div>
            <span>Co<b>flix</b></span>
        </a>

        <!-- Desktop Navigation -->
        <nav class="main-nav">
            <a href="/" class="nav-link {% if request.url.path == '/' %}active{% endif %}">
                <i class="fas fa-house"></i> Accueil
            </a>
            <a href="/films" class="nav-link {% if request.url.path.startswith('/films') %}active{% endif %}">
                <i class="fas fa-film"></i> Films
            </a>
            <a href="/series" class="nav-link {% if request.url.path.startswith('/series') %}active{% endif %}">
                <i class="fas fa-tv"></i> Séries
            </a>
            <a href="/dramas" class="nav-link {% if request.url.path.startswith('/drama') or request.url.path.startswith('/dramas') %}active{% endif %}">
                <i class="fas fa-earth-asia"></i> K-Dramas
            </a>
            <a href="/animes" class="nav-link {% if request.url.path.startswith('/anime') or request.url.path.startswith('/animes') %}active{% endif %}">
                <i class="fas fa-dragon"></i> Animés
            </a>
        </nav>

        <!-- Search Bar with Live Dropdown -->
        <form class="search-bar" action="/recherche" method="get" id="search-form" autocomplete="off">
            <div class="search-input-wrapper">
                <i class="fas fa-magnifying-glass search-icon"></i>
                <input type="text" name="q" id="search-input" placeholder="Films, séries, K-Dramas, animés…"
                       value="{% block search_value %}{% endblock %}">
            </div>
            <div id="search-dropdown" class="search-dropdown" hidden></div>
        </form>
    </div>
</header>

<!-- Main Container -->
<main class="site-main">
    {% block content %}{% endblock %}
</main>

<!-- Mobile Bottom Navigation (Native App feel) -->
<nav class="mobile-bottom-bar" aria-label="Navigation mobile">
    <a href="/" class="mobile-tab {% if request.url.path == '/' %}active{% endif %}">
        <i class="fas fa-house"></i>
        <span>Accueil</span>
    </a>
    <a href="/films" class="mobile-tab {% if request.url.path.startswith('/films') %}active{% endif %}">
        <i class="fas fa-film"></i>
        <span>Films</span>
    </a>
    <a href="/series" class="mobile-tab {% if request.url.path.startswith('/series') %}active{% endif %}">
        <i class="fas fa-tv"></i>
        <span>Séries</span>
    </a>
    <a href="/dramas" class="mobile-tab {% if request.url.path.startswith('/drama') or request.url.path.startswith('/dramas') %}active{% endif %}">
        <i class="fas fa-earth-asia"></i>
        <span>Dramas</span>
    </a>
    <a href="/animes" class="mobile-tab {% if request.url.path.startswith('/anime') or request.url.path.startswith('/animes') %}active{% endif %}">
        <i class="fas fa-dragon"></i>
        <span>Animés</span>
    </a>
    <a href="/recherche" class="mobile-tab {% if request.url.path == '/recherche' %}active{% endif %}">
        <i class="fas fa-magnifying-glass"></i>
        <span>Recherche</span>
    </a>
</nav>

<!-- Footer -->
<footer class="site-footer">
    <p>© 2026 Coflix — Plateforme de streaming multi-sources (Films, Séries, K-Dramas & Animés).</p>
</footer>

<!-- Global Scripts -->
<script>
(function () {
    const input = document.getElementById('search-input');
    const dropdown = document.getElementById('search-dropdown');
    if (!input || !dropdown) return;

    let timer = null;

    input.addEventListener('input', () => {
        clearTimeout(timer);
        const q = input.value.trim();
        if (q.length < 2) { 
            dropdown.hidden = true; 
            return; 
        }
        timer = setTimeout(() => {
            fetch(`/api/search?q=${encodeURIComponent(q)}`)
                .then(r => r.json())
                .then(data => {
                    const results = data.results || [];
                    if (!results.length) { 
                        dropdown.hidden = true; 
                        return; 
                    }
                    dropdown.innerHTML = results.map(r => {
                        let badgeIcon = '<i class=\"fas fa-film\"></i> Film';
                        if (r.type === 'drama') badgeIcon = '<i class=\"fas fa-earth-asia\"></i> K-Drama';
                        else if (r.type === 'anime') badgeIcon = '<i class=\"fas fa-dragon\"></i> Animé';
                        else if (r.type === 'series') badgeIcon = '<i class=\"fas fa-tv\"></i> Série';

                        return `
                        <a href="${r.url || ('/film/' + r.slug)}" class="dd-item">
                            <img class="dd-poster" src="${r.image}" alt="${r.title}" onerror="this.style.display='none'">
                            <div class="dd-info">
                                <span class="dd-title">${r.title}</span>
                                <span class="dd-badge">${badgeIcon}</span>
                            </div>
                        </a>`;
                    }).join('');
                    dropdown.hidden = false;
                })
                .catch(() => { dropdown.hidden = true; });
        }, 220);
    });

    document.addEventListener('click', e => {
        if (!document.getElementById('search-form').contains(e.target)) {
            dropdown.hidden = true;
        }
    });
})();
</script>

</html>
